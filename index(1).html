<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mighty Miami Events Calendar</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(180deg, #eef8ff 0%, #ffffff 60%, #f7f0df 100%);
      color: #08265c;
      padding: 24px;
    }
    .card {
      width: min(620px, 100%);
      background: #fff;
      border: 2px solid #d79a22;
      border-radius: 24px;
      padding: 44px 28px;
      text-align: center;
      box-shadow: 0 16px 45px rgba(8,38,92,.14);
    }
    .month {
      color: #c98510;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: .22em;
      margin-bottom: 8px;
    }
    h1 {
      margin: 0;
      font-size: clamp(38px, 9vw, 64px);
      line-height: .95;
      letter-spacing: .03em;
    }
    h2 {
      margin: 12px 0 26px;
      color: #c98510;
      font-size: clamp(22px, 5vw, 34px);
      letter-spacing: .08em;
    }
    p {
      font-size: 18px;
      line-height: 1.45;
      margin: 0 auto 28px;
      max-width: 470px;
    }
    .button {
      display: block;
      width: 100%;
      padding: 22px 18px;
      border-radius: 14px;
      background: #c98510;
      color: #fff;
      text-decoration: none;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: .03em;
    }
    .small {
      margin-top: 22px;
      font-size: 13px;
      color: #52627c;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="month">AUGUST 2026</div>
    <h1>MIGHTY MIAMI</h1>
    <h2>EVENTS CALENDAR</h2>
    <p>Tap below to add the Mighty Miami events to your calendar.</p>

    <a class="button"
       href="webcal://raw.githubusercontent.com/saraangee/MightyMiamiEventsCalendar/main/miami-events.ics">
       ADD EVENTS TO CALENDAR
    </a>

    <div class="small">Church of Scientology Miami · 2220 S Dixie Hwy, Miami, FL 33133</div>
  </main>
</body>
</html>
